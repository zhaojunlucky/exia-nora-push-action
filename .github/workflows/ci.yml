name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n scripts/push-image.sh
          bash -n scripts/push-raw.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts

  test-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Test push-image.sh against a real crane client
        run: python3 -m unittest discover -s scripts -p 'test_push_image.py'
