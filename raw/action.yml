name: 'Push raw artifact to Nora'
description: >-
  Upload a local file to Nora's raw/generic registry over GitHub Actions
  OIDC (audience "nora"). The calling job must set `permissions: id-token: write`.
inputs:
  file:
    description: 'Local file to upload'
    required: true
  target:
    description: >-
      REGISTRY/PATH to upload to, e.g.
      nora.exia.app/mcp-command-gateway/release/1.0.42/mcp-command-gateway_linux_amd64
    required: true
  allow-overwrite:
    description: >-
      Allow overwriting an existing path via a conditional If-Match PUT.
      Nora raw objects are immutable by default (409 on re-PUT); only pass
      this for an intentionally mutable pointer file such as latest.json.
      Per-build paths should stay unique and never need this.
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Get nora OIDC token
      id: nora-oidc
      uses: actions/github-script@v7
      with:
        script: |
          const token = await core.getIDToken('nora');
          core.setSecret(token);
          core.setOutput('token', token);

    - name: Push raw artifact to Nora
      shell: bash
      env:
        NORA_TOKEN: ${{ steps.nora-oidc.outputs.token }}
        FILE: ${{ inputs.file }}
        TARGET: ${{ inputs.target }}
        ALLOW_OVERWRITE: ${{ inputs.allow-overwrite }}
      run: |
        set -euo pipefail
        if [[ "$ALLOW_OVERWRITE" == "true" ]]; then
          "${{ github.action_path }}/../scripts/push-raw.sh" "$FILE" "$TARGET" --allow-overwrite
        else
          "${{ github.action_path }}/../scripts/push-raw.sh" "$FILE" "$TARGET"
        fi
